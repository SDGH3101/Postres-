# ===== Aplicacion =====
spring.application.name=postres-mariangel
server.port=8080

# ===== Base de datos (Base de datos Postres Mariangel) =====
spring.datasource.url=jdbc:mysql://localhost:3306/postres?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ===== Deshabilitar Spring Security (usamos sesion manual) =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===== Manejo de sesion =====
server.servlet.session.timeout=30m

# ===== Mensajes de validacion en espanol =====
server.error.include-message=always
