<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Gasto</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<div class="app-body">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="sec-hdr"><div class="sec-title">✏️ Editar Gasto</div></div>

    <div class="fcard">
      <form th:action="@{/compras/{id}(id=${gasto.idGasto})}" method="post">
        <div class="fgrid c2">
          <div class="fg">
            <label>Descripción</label>
            <input type="text" name="descripcion" th:value="${gasto.descripcion}" required maxlength="200">
          </div>
          <div class="fg">
            <label>Categoría</label>
            <input type="text" name="categoria" th:value="${gasto.categoria}" required>
          </div>
          <div class="fg">
            <label>Fecha</label>
            <input type="date" name="fecha" th:value="${gasto.fecha}" required>
          </div>
          <div class="fg">
            <label>Monto</label>
            <input type="number" name="monto" step="0.01" min="0" th:value="${gasto.monto}" required>
          </div>
        </div>
        <div style="margin-top:10px">
          <button type="submit" class="btn-p">Actualizar</button>
          <a th:href="@{/compras}" style="color:var(--muted);margin-left:12px;">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
