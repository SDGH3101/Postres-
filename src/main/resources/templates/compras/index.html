<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos - Postres Mariangel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<div class="app-body">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="sec-hdr">
      <div class="sec-title">💸 Gestión de Gastos</div>
      <div class="sec-sub">Gastos y compras menores</div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="kpi-val" th:text="'$' + ${#numbers.formatDecimal(totalGastos,1,'POINT',0,'COMMA')}"></div><div class="kpi-lab">Total gastos</div></div>
      <div class="kpi"><div class="kpi-val" th:text="${#lists.size(gastos)}"></div><div class="kpi-lab">Registros de gasto</div></div>
      <div class="kpi"><div class="kpi-val" th:text="${#lists.size(compras)}"></div><div class="kpi-lab">Compras menores</div></div>
    </div>

    <div style="margin-bottom:16px">
      <a th:href="@{/compras/nueva}" class="btn-p" style="text-decoration:none;">➕ Nuevo Gasto / Compra</a>
    </div>

    <div class="card">
      <div class="card-hdr"><div class="card-title">Gastos</div></div>
      <table class="tbl">
        <thead><tr><th>ID</th><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Monto</th><th>Presupuesto</th><th>Diferencia</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr th:each="g : ${gastos}">
            <td th:text="${g[0]}"></td>
            <td th:text="${g[1]}"></td>
            <td th:text="${g[2]}"></td>
            <td><span class="chip" th:text="${g[3]}"></span></td>
            <td th:text="'$' + ${#numbers.formatDecimal(g[4],1,'POINT',0,'COMMA')}"></td>
            <td th:text="'$' + ${#numbers.formatDecimal(g[5],1,'POINT',0,'COMMA')}"></td>
            <td th:text="'$' + ${#numbers.formatDecimal(g[6],1,'POINT',0,'COMMA')}"></td>
            <td class="actions">
              <a th:href="@{/compras/{id}/editar(id=${g[0]})}" class="btn-e">Editar</a>
              <form th:action="@{/compras/{id}/eliminar(id=${g[0]})}" method="post" style="display:inline"
                    onsubmit="return confirm('¿Eliminar gasto?');">
                <button type="submit" class="btn-d">Eliminar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
