<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postres Mariangel - Bienvenido</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<div class="app-body">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="sec-hdr">
      <div class="sec-title">🎂 Bienvenido a Postres Mariangel</div>
      <div class="sec-sub" th:if="${sesionUsuario != null}"
           th:text="'Hola, ' + ${sesionUsuario?.nombre} + ' · gracias por ser parte de nuestra familia'"></div>
      <div class="sec-sub" th:unless="${sesionUsuario != null}">Gracias por ser parte de nuestra familia</div>
    </div>

    <div style="margin:32px 0;text-align:center;">
      <p style="color:var(--muted);max-width:520px;margin:0 auto 20px;">
        Descubre nuestros postres artesanales, precios y disponibilidad.
      </p>
      <a th:href="@{/catalogo}" class="btn-p" style="text-decoration:none;">Ver catálogo de productos</a>
    </div>
  </main>
</div>
</body>
</html>
