<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuevo Empleado</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<div class="app-body">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="sec-hdr"><div class="sec-title">➕ Nuevo Empleado</div></div>

    <div class="fcard">
      <form th:action="@{/empleados}" method="post">
        <div class="fgrid c2">
          <div class="fg">
            <label>Nombre completo</label>
            <input type="text" name="nombre" required maxlength="100">
          </div>
          <div class="fg">
            <label>Correo electrónico</label>
            <input type="email" name="correo" required>
          </div>
          <div class="fg">
            <label>Fecha de nacimiento</label>
            <input type="date" name="fecha_nacimiento" required>
          </div>
          <div class="fg">
            <label>Contraseña</label>
            <input type="password" name="pass" required minlength="6">
          </div>
          <div class="fg">
            <label>Cargo</label>
            <input type="text" name="cargo" required maxlength="50" placeholder="Ej: Repostero, Mesero">
          </div>
          <div class="fg">
            <label>Salario</label>
            <input type="number" name="salario" step="0.01" min="0" value="0" required>
          </div>
          <div class="fg">
            <label>Horas trabajadas</label>
            <input type="number" name="horas_trabajadas" min="0" value="0" required>
          </div>
        </div>
        <div style="margin-top:10px">
          <button type="submit" class="btn-p">Crear Empleado</button>
          <a th:href="@{/empleados}" style="color:var(--muted);margin-left:12px;">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
