<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendimiento Empleado</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<div class="app-body">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="sec-hdr">
      <div class="sec-title">👷 <span th:text="${rendimiento[1]}"></span></div>
      <div class="sec-sub">Rendimiento del empleado</div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="kpi-val" th:text="${rendimiento[4]}"></div><div class="kpi-lab">Ventas realizadas</div></div>
      <div class="kpi"><div class="kpi-val" th:text="'$' + ${#numbers.formatDecimal(rendimiento[5],1,'POINT',0,'COMMA')}"></div><div class="kpi-lab">Ingresos generados</div></div>
      <div class="kpi"><div class="kpi-val" th:text="'$' + ${#numbers.formatDecimal(rendimiento[6],1,'POINT',0,'COMMA')}"></div><div class="kpi-lab">Promedio por venta</div></div>
    </div>

    <div class="fcard">
      <p><strong>Cargo:</strong> <span class="chip" th:text="${rendimiento[2]}"></span></p>
      <p><strong>Salario:</strong> <span th:text="'$' + ${#numbers.formatDecimal(rendimiento[3],1,'POINT',0,'COMMA')}"></span></p>
      <p><strong>Ratio ingresos/salario:</strong> <span th:text="${rendimiento[7]}"></span> ×</p>
    </div>

    <a th:href="@{/empleados}" class="btn-e">← Volver al personal</a>
  </main>
</div>
</body>
</html>
