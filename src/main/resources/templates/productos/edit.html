<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Producto</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
<style>.err{color:#c0392b;font-size:.8rem;margin-top:4px;display:block}</style>
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<div class="app-body">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="sec-hdr"><div class="sec-title">✏️ Editar Producto</div></div>

    <div class="fcard">
      <form th:action="@{/productos/{id}(id=${producto.idProducto})}" th:object="${producto}" method="post">
        <div class="fgrid c2">
          <div class="fg">
            <label>Descripción</label>
            <input type="text" th:field="*{descripcion}" maxlength="200">
            <span class="err" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
          </div>
          <div class="fg">
            <label>Tipo</label>
            <select th:field="*{tipo}">
              <option value="postre">Postre</option>
              <option value="bebida">Bebida</option>
              <option value="otro">Otro</option>
            </select>
            <span class="err" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
          </div>
          <div class="fg">
            <label>Precio</label>
            <input type="number" th:field="*{precio}" step="0.01" min="0">
            <span class="err" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
          </div>
          <div class="fg">
            <label>Stock</label>
            <input type="number" th:field="*{stock}" min="0">
            <span class="err" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
          </div>
          <div class="fg">
            <label>Stock mínimo</label>
            <input type="number" th:field="*{stockMinimo}" min="0">
            <span class="err" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></span>
          </div>
          <div class="fg">
            <label>Fecha de caducidad (opcional)</label>
            <input type="date" th:field="*{fechaCaducidad}">
          </div>
        </div>
        <div style="margin-top:10px">
          <button type="submit" class="btn-p">Actualizar Producto</button>
          <a th:href="@{/productos}" style="color:var(--muted);margin-left:12px;">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
