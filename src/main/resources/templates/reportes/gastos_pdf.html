<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de Gastos - Postres Mariangel</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
<style>body{background:#fff;padding:24px;}</style>
</head>
<body>
<div class="no-print" style="margin-bottom:16px">
  <button onclick="window.print()" class="btn-p">🖨️ Imprimir / Guardar PDF</button>
  <a th:href="@{/reportes}" class="btn-e" style="text-decoration:none">← Volver</a>
</div>

<div class="report-logo">🍰 Postres<em>Mariangel</em></div>
<div style="color:var(--muted);margin-bottom:18px">Reporte de Gastos · Generado el <span th:text="${#temporals.format(#temporals.createToday(), 'dd/MM/yyyy')}"></span></div>

<table class="tbl">
  <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Monto</th><th>Presupuesto</th></tr></thead>
  <tbody>
    <tr th:each="g : ${gastos}">
      <td th:text="${g.fecha}"></td>
      <td th:text="${g.descripcion}"></td>
      <td><span class="chip" th:text="${g.categoria}"></span></td>
      <td th:text="'$' + ${#numbers.formatDecimal(g.monto,1,'POINT',0,'COMMA')}"></td>
      <td th:text="'$' + ${#numbers.formatDecimal(g.presupuesto,1,'POINT',0,'COMMA')}"></td>
    </tr>
  </tbody>
</table>
</body>
</html>
