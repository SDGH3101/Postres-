<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Usuario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">
<style>.err{color:#c0392b;font-size:.8rem;margin-top:4px;display:block}</style>
</head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<div class="app-body">
  <div th:replace="~{fragments/layout :: sidebar}"></div>
  <main class="main">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="sec-hdr"><div class="sec-title">✏️ Editar Usuario</div></div>

    <div class="fcard">
      <form th:action="@{/usuarios/{id}(id=${usuario.idUsuario})}" th:object="${usuarioForm}" method="post">
        <div class="fgrid c2">
          <div class="fg">
            <label>Nombre completo</label>
            <input type="text" th:field="*{nombre}" maxlength="100">
            <span class="err" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
          </div>
          <div class="fg">
            <label>Fecha de nacimiento</label>
            <input type="date" th:field="*{fechaNacimiento}">
            <span class="err" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></span>
          </div>
          <div class="fg">
            <label>Nueva contraseña (dejar vacío para no cambiar)</label>
            <input type="password" th:field="*{pass}" minlength="6">
            <span class="err" th:if="${#fields.hasErrors('pass')}" th:errors="*{pass}"></span>
          </div>
        </div>
        <div style="margin-top:10px">
          <button type="submit" class="btn-p">Actualizar</button>
          <a th:href="@{/usuarios}" style="color:var(--muted);margin-left:12px;">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
